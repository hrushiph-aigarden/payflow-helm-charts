# PayFlow Pro Helm Chart — GCP Dev Environment Values (POC Cost-Optimized)
# Designed for GKE Autopilot + localhost port-forwarding

replicaCount: 1

image:
  repository: nginx
  pullPolicy: Always
  tag: alpine

# GKE Autopilot resource requests (Autopilot enforces minimum requests of 250m CPU and 512Mi memory per pod, so we specify them to match GKE rules exactly)
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Ingress: Disabled to avoid GCLB monthly base charge ($20/month)
# Access the service via localhost port-forwarding:
# $ kubectl port-forward service/payflow-pro 8080:8080
ingress:
  enabled: false

# Autoscale & PDB: Disabled to minimize pod footprint
autoscaling:
  enabled: false

podDisruptionBudget:
  enabled: false

# Vault sidecar: Disabled for mock POC mode
vault:
  enabled: false

env:
  LOG_LEVEL: debug
  PAYMENT_GATEWAY_URL: http://mock-gateway.payflow-dev.svc.cluster.local:8080
  DATABASE_HOST: "10.114.0.3"

# Workload Identity: GCP service account binding (equivalent of AWS IRSA)
serviceAccount:
  create: true
  annotations:
    iam.gke.io/gcp-service-account: "payflow-dev-sa@gcp-project.iam.gserviceaccount.com"
  name: "payflow-pro"

# Affinity & NodeSelector: Disabled or basic (GKE Autopilot manages scheduling natively)
nodeSelector:
  pci-scope: null
tolerations: []
affinity: {}

# Security context override for demo: nginx:alpine needs writable /var/cache/nginx
# Production PayFlow Pro uses readOnlyRootFilesystem: true (Go binary needs no write access)
# For the POC demo we disable this so nginx can create its temp directories
securityContext:
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  runAsNonRoot: false
  runAsUser: 0
  capabilities:
    drop: []

podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  fsGroup: 0

# Extra volume mounts for nginx cache dirs (used when readOnlyRootFilesystem is true)
extraVolumeMounts: []
extraVolumes: []

# Override probes to work with nginx:alpine (responds on port 80 at /)
# The real PayFlow Pro app serves on 8080; for the demo POC we use nginx as a stand-in
livenessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /
    port: 80
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 1
  failureThreshold: 12
